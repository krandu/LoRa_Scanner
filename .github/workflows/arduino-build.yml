name: Arduino Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**.ino"
      - "**.h"
      - "**.cpp"
      - "**.csv"
      - ".github/workflows/arduino-build.yml"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile — Heltec WiFi LoRa 32 V2
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 arduino-cli ──────────────────────────────────
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      # ── 3. 安装 Python 工具（esptool & 下载 spiffsgen.py）────
      - name: Install Python tools
        run: |
          pip install esptool --quiet
          curl -sSL https://raw.githubusercontent.com/espressif/esp-idf/master/components/spiffs/spiffsgen.py -o /usr/local/bin/spiffsgen.py
          chmod +x /usr/local/bin/spiffsgen.py

      # ── 4. 配置 ESP32 官方 Board Manager URL ──────────────────
      - name: Configure arduino-cli
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # ── 5. 更新索引 & 安装 ESP32 官方 Core (2.0.17 兼容版本) ──
      - name: Update index and install core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      # ── 6. 安装依赖库 ────────────────────────────────────────
      - name: Install libraries
        run: |
          arduino-cli lib install "Heltec ESP32 Dev-Boards"
          arduino-cli lib install "LoRa"
          arduino-cli lib install "ESP8266 and ESP32 OLED driver for SSD1306 displays"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"

      # ── 7. 覆盖默认分区表并编译（使用标准 esp32 FQBN）─────────
      - name: Compile sketch
        run: |
          # 使用官方 esp32 包中的 heltec_wifi_lora_32_V2 FQBN
          FQBN="esp32:esp32:heltec_wifi_lora_32_V2"
          echo "FQBN=$FQBN" >> $GITHUB_ENV
          echo "Using FQBN: $FQBN"

          # 覆盖开发板默认的分区表
          PART_DIR=$(find /home/runner/.arduino15/packages/esp32/hardware/esp32/ -type d -name "partitions" | head -1)
          if [ -d "$PART_DIR" ]; then
            echo "Copying custom partitions.csv to $PART_DIR/default.csv"
            cp spiffs/partitions.csv "$PART_DIR/default.csv"
          fi

          # --warnings none 忽略第三方 C++ 溢出警告
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings none \
            --export-binaries \
            --build-property "upload.maximum_size=3342336" \
            --output-dir build/ \
            LoRa_Scanner/LoRa_Scanner.ino

      # ── 8. 列出 build 目录内容（调试用）─────────────────────
      - name: List build outputs
        run: ls -lh build/

      # ── 9. 生成 SPIFFS 镜像 ──────────────────────────────────
      - name: Generate SPIFFS image
        run: |
          mkdir -p spiffs_data
          if [ -d "spiffs" ]; then
            rsync -av --exclude='partitions.csv' spiffs/ spiffs_data/ || true
          fi
          python3 /usr/local/bin/spiffsgen.py \
            1572864 \
            spiffs_data/ \
            build/spiffs.bin \
            --page-size 256 \
            --block-size 4096
          echo "SPIFFS image:"
          ls -lh build/spiffs.bin

      # ── 10. 合并成单一可烧录固件 ─────────────────────────────
      - name: Merge firmware (merged-firmware.bin)
        run: |
          BOOT=$(find build/ -name "bootloader.bin"  | head -1)
          PART=$(find build/ -name "partitions.bin"  | head -1)
          BAPP=$(find build/ -name "boot_app0.bin"   | head -1)
          APP=$(find build/  -name "*.ino.bin" ! -name "*bootloader*" ! -name "*partitions*" | head -1)

          echo "bootloader : $BOOT"
          echo "partitions : $PART"
          echo "boot_app0  : $BAPP"
          echo "app        : $APP"
          echo "spiffs     : build/spiffs.bin"

          esptool.py --chip esp32 merge_bin \
            --output build/merged-firmware.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 8MB \
            0x1000   "$BOOT" \
            0x8000   "$PART" \
            0xe000   "$BAPP" \
            0x10000  "$APP"  \
            0x670000 build/spiffs.bin

          echo "=== merged-firmware.bin ==="
          ls -lh build/merged-firmware.bin

      # ── 11. 上传所有产物 ─────────────────────────────────────
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoRa_Scanner-firmware
          path: |
            build/merged-firmware.bin
            build/spiffs.bin
            build/*.ino.bin
            build/*.ino.elf
            build/*.ino.map
          retention-days: 30

      # ── 12. 打印固件摘要 ─────────────────────────────────────
      - name: Firmware summary
        run: |
          echo "==============================="
          echo " Firmware build summary"
          echo "==============================="
          for f in \
            build/merged-firmware.bin \
            build/spiffs.bin \
            build/*.ino.bin; do
            [ -f "$f" ] && printf "%-40s %s\n" "$f" "$(du -sh $f | cut -f1)"
          done
          echo ""
          echo "Flash 刷写命令（merged-firmware，一键刷入）："
          echo "  esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 merged-firmware.bin"
