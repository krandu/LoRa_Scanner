name: Arduino Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**.ino"
      - "**.h"
      - "**.cpp"
      - "**.csv"
      - ".github/workflows/arduino-build.yml"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile — Heltec WiFi LoRa 32 V2
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 arduino-cli ──────────────────────────────────
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      # ── 3. 安装 Python 工具（esptool & 下载 spiffsgen.py）────
      - name: Install Python tools
        run: |
          pip install esptool --quiet
          curl -sSL https://raw.githubusercontent.com/espressif/esp-idf/master/components/spiffs/spiffsgen.py -o /usr/local/bin/spiffsgen.py
          chmod +x /usr/local/bin/spiffsgen.py

      # ── 4. 配置 ESP32 官方 Board Manager URL ──────────────────
      - name: Configure arduino-cli
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # ── 5. 更新索引 & 安装 ESP32 官方 Core (2.0.17 兼容版本) ──
      - name: Update index and install core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      # ── 6. 安装标准开源依赖库 ─────────────────────────────────
      - name: Install libraries
        run: |
          arduino-cli lib install "LoRa"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"

      # ── 7. 编译项目 ──────────────────────────────────────────
      - name: Compile sketch
        run: |
          FQBN="esp32:esp32:heltec_wifi_lora_32_V2"
          echo "FQBN=$FQBN" >> $GITHUB_ENV

          # 覆盖默认分区表（如果存在）
          PART_DIR=$(find /home/runner/.arduino15/packages/esp32/hardware/esp32/ -type d -name "partitions" | head -1)
          if [ -d "$PART_DIR" ] && [ -f "spiffs/partitions.csv" ]; then
            echo "Copying custom partitions.csv to $PART_DIR/default.csv"
            cp spiffs/partitions.csv "$PART_DIR/default.csv"
          fi

          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings none \
            --export-binaries \
            --output-dir build/ \
            LoRa_Scanner/LoRa_Scanner.ino

      # ── 8. 生成 SPIFFS 镜像 ──────────────────────────────────
      - name: Generate SPIFFS image
        run: |
          mkdir -p spiffs_data
          if [ -d "spiffs" ]; then
            rsync -av --exclude='partitions.csv' spiffs/ spiffs_data/ || true
          fi
          python3 /usr/local/bin/spiffsgen.py \
            1572864 \
            spiffs_data/ \
            build/spiffs.bin \
            --page-size 256 \
            --block-size 4096
          echo "SPIFFS image created."

      # ── 9. 智能搜索并合并固件 (兼容 esptool v5+ 语法) ───────────
      - name: Merge firmware (merged-firmware.bin)
        run: |
          # 优先在 build/ 目录精准匹配 arduino-cli 导出的当前板子 bootloader
          BOOT=$(find build/ -name "*.bootloader.bin" | head -1)
          
          # 如果 build/ 下没找到，再降级去查找 esp32 默认的标准 bootloader
          if [ -z "$BOOT" ]; then
            BOOT=$(find /home/runner/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/sdk/esp32/bin/ -name "bootloader_*.bin" | head -1)
          fi

          PART=$(find build/ -name "*.partitions.bin" -o -name "partitions.bin" | head -1)
          BAPP=$(find /home/runner/.arduino15/ -name "boot_app0.bin" | head -1)
          APP=$(find build/ -name "*.ino.bin" ! -name "*bootloader*" ! -name "*partitions*" | head -1)

          echo "Found bootloader : $BOOT"
          echo "Found partitions : $PART"
          echo "Found boot_app0  : $BAPP"
          echo "Found app        : $APP"
          echo "Found spiffs     : build/spiffs.bin"

          if [ -z "$BOOT" ] || [ -z "$PART" ] || [ -z "$BAPP" ] || [ -z "$APP" ]; then
            echo "Error: Could not locate all required bin files for merging."
            exit 1
          fi

          # 注意：esptool v5 要求 --chip 等参数写在 merge-bin 子命令之前
          esptool --chip esp32 \
            merge-bin \
            --output build/merged-firmware.bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 8MB \
            0x1000   "$BOOT" \
            0x8000   "$PART" \
            0xe000   "$BAPP" \
            0x10000  "$APP" \
            0x670000 build/spiffs.bin

          ls -lh build/merged-firmware.bin

      # ── 10. 上传产物 ─────────────────────────────────────────
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoRa_Scanner-firmware
          path: |
            build/merged-firmware.bin
            build/spiffs.bin
            build/*.bin
          retention-days: 30
